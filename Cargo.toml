[package]
name = "pjsua-rust"
version = "0.1.0"
edition = "2021"
description = "Safe Rust bindings for PJSIP's PJSUA library"
license = "MIT"

[features]
default = []
integration-tests = []

[dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"

[build-dependencies]
bindgen = "0.71"
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
